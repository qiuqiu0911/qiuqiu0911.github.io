<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">同 Pod Sidecar 网络关系</title>
  <desc id="desc">V2Ray 容器和 WARP proxy sidecar 共享同一个 Pod 网络命名空间，V2Ray 通过 localhost 访问 socks 代理。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .pod { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 18; }
      .container { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 12; }
      .sidecar { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 12; }
      .net { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.8; rx: 10; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; font-size: 24px; font-weight: 650; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; font-size: 17px; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; font-size: 15px; }
      .line { fill: none; stroke: #111827; stroke-width: 2.5; marker-end: url(#arrow); }
      .bad { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 8; }
      .badge { fill: #ffffff; stroke: #cbd5e1; rx: 14; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="60" y="64" class="text">为什么用 sidecar：共享 localhost，但不改默认路由</text>
  <text x="60" y="96" class="sub">两个容器在同一个 Pod 网络命名空间内，V2Ray 访问 127.0.0.1:40000 即可进入 WARP proxy。</text>

  <rect x="110" y="145" width="760" height="380" class="pod"/>
  <text x="150" y="192" class="text">Pod: v2ray-deployment</text>
  <rect x="150" y="235" width="260" height="160" class="container"/>
  <text x="280" y="300" text-anchor="middle" class="text">v2ray</text>
  <text x="280" y="332" text-anchor="middle" class="sub">outbound: warp/direct</text>

  <rect x="550" y="235" width="260" height="160" class="sidecar"/>
  <text x="680" y="300" text-anchor="middle" class="text">warp-proxy</text>
  <text x="680" y="332" text-anchor="middle" class="sub">socks5 :40000</text>

  <rect x="220" y="440" width="500" height="52" class="net"/>
  <text x="470" y="474" text-anchor="middle" class="sub">shared network namespace / localhost</text>

  <path class="line" d="M410 315 H540"/>
  <rect x="435" y="278" width="92" height="34" class="badge"/>
  <text x="481" y="300" text-anchor="middle" class="small">127.0.0.1</text>

  <rect x="940" y="213" width="190" height="100" class="sidecar"/>
  <text x="1035" y="254" text-anchor="middle" class="text">Cloudflare</text>
  <text x="1035" y="286" text-anchor="middle" class="sub">WARP egress</text>
  <path class="line" d="M810 288 C870 288 880 263 930 263"/>

  <rect x="940" y="392" width="190" height="100" class="container"/>
  <text x="1035" y="433" text-anchor="middle" class="text">Internet</text>
  <text x="1035" y="465" text-anchor="middle" class="sub">VPS direct</text>
  <path class="line" d="M410 370 C620 505 780 442 930 442"/>

  <path class="bad" d="M675 395 C720 430 780 470 855 506"/>
  <text x="705" y="536" class="small" fill="#dc2626">避免 TUN 模式接管 Pod 默认路由</text>
</svg>
