<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">部署验证检查清单</title>
  <desc id="desc">从 Pod 状态、WARP 连接、socks 访问、direct 出口和 V2Ray 日志五个层面验证部署。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .head { fill: #0f172a; }
      .ok { fill: #dcfce7; stroke: #16a34a; }
      .warn { fill: #fff7ed; stroke: #f97316; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; font-size: 24px; font-weight: 650; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; font-size: 17px; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; font-size: 15px; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; fill: #334155; font-size: 14px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="60" y="62" class="text">部署后不要只看 Pod Running</text>
  <text x="60" y="94" class="sub">这套方案至少要验证 WARP 可用、Google 命中 WARP、非 Google 仍走 direct。</text>

  <rect x="70" y="145" width="320" height="160" class="card"/>
  <circle cx="105" cy="185" r="16" class="ok"/>
  <text x="135" y="193" class="text">Pod 状态</text>
  <text x="105" y="235" class="mono">kubectl get pods -n v2ray</text>
  <text x="105" y="266" class="small">期望：READY 为 2/2 Running</text>

  <rect x="440" y="145" width="320" height="160" class="card"/>
  <circle cx="475" cy="185" r="16" class="ok"/>
  <text x="505" y="193" class="text">WARP 状态</text>
  <text x="475" y="235" class="mono">kubectl logs ... -c warp-proxy</text>
  <text x="475" y="266" class="small">期望：WARP status: Connected</text>

  <rect x="810" y="145" width="320" height="160" class="card"/>
  <circle cx="845" cy="185" r="16" class="ok"/>
  <text x="875" y="193" class="text">socks 出口</text>
  <text x="845" y="235" class="mono">curl --socks5-hostname 127.0.0.1:40000</text>
  <text x="845" y="266" class="small">期望：cloudflare trace 中 warp=on</text>

  <rect x="255" y="360" width="320" height="160" class="card"/>
  <circle cx="290" cy="400" r="16" class="warn"/>
  <text x="320" y="408" class="text">Direct 出口</text>
  <text x="290" y="450" class="mono">wget -qO- http://ifconfig.me/ip</text>
  <text x="290" y="481" class="small">期望：仍是 VPS 原始 IP</text>

  <rect x="625" y="360" width="320" height="160" class="card"/>
  <circle cx="660" cy="400" r="16" class="warn"/>
  <text x="690" y="408" class="text">路由命中</text>
  <text x="660" y="450" class="mono">grep -Ei 'google|warp|detour'</text>
  <text x="660" y="481" class="small">期望：taking detour [warp]</text>
</svg>
